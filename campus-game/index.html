<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Campus Quest</title>
<style>
  @font-face { font-family: "PS2P"; src: url("Press_Start_2P.woff2") format("woff2"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #12091f; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #3b1d5c 0%, #12091f 70%); font-family: "PS2P", monospace; }
  #frame { position: relative; padding: 10px; border-radius: 14px;
    background: linear-gradient(180deg, #f4f6fb 0%, #b9c2d3 45%, #8d97ab 55%, #dfe4ee 100%);
    box-shadow: 0 0 0 2px #2a2f3a, 0 12px 40px rgba(0,0,0,.6), inset 0 1px 0 #fff; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border-radius: 4px;
    box-shadow: inset 0 0 0 2px #1d2230; outline: none; }
  /* EXIT: always visible in the top-right corner of the screen */
  #close { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 10;
    height: 34px; padding: 0 12px; border-radius: 17px; border: 2px solid #2a2f3a;
    background: linear-gradient(180deg, #ffd0b0, #ff8a4c); color: #3b1206; font: 10px "PS2P", monospace;
    cursor: pointer; box-shadow: 0 2px 0 #2a2f3a; }
  #touch { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; display: none; }
  .touch #touch { display: block; }
  .pad { position: fixed; bottom: 22px; left: 22px; width: 132px; height: 132px; pointer-events: auto; touch-action: none; }
  .pad button { pointer-events: none; } /* the pad as a whole handles touches */
  .pad button, .ab button { position: absolute; width: 44px; height: 44px; border-radius: 10px; border: 2px solid #2a2f3a;
    background: linear-gradient(180deg, #eef1f7, #a9b2c4); color: #2a2f3a; font: 12px "PS2P", monospace; opacity: .85; padding: 0; }
  .pad .u { left: 44px; top: 0; } .pad .d { left: 44px; bottom: 0; } .pad .l { left: 0; top: 44px; } .pad .r { right: 0; top: 44px; }
  .ab { position: fixed; bottom: 34px; right: 22px; width: 120px; height: 100px; pointer-events: auto; touch-action: none; }
  .ab button { border-radius: 50%; width: 52px; height: 52px; }
  .ab .a { right: 0; top: 0; background: linear-gradient(180deg, #ffd0b0, #ff8a4c); }
  .ab .m { left: 0; top: 40px; }
  @media (orientation: landscape) { .pad { bottom: 16px; left: max(16px, env(safe-area-inset-left)); } .ab { bottom: 20px; right: max(16px, env(safe-area-inset-right)); } }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="320" height="240" tabindex="0" aria-label="Campus Quest: a pixel walk around the University of West Georgia"></canvas>
  <button id="close" title="Exit (Esc)" aria-label="Exit the game and go back to the site">EXIT</button>
</div>
<div id="touch">
  <div class="pad">
    <button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button>
    <button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button>
  </div>
  <div class="ab"><button class="a" data-k="a">A</button><button class="m" data-k="map">MAP</button></div>
</div>
<script src="map.js"></script>
<script src="game.js?v=3"></script>
</body>
</html>
